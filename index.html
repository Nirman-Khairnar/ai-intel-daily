<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Intel Daily — NK's Ops</title>
<style>
:root {
  --bg: #0a0a0f;
  --card: #12121a;
  --border: #1e1e2e;
  --accent: #6c5ce7;
  --accent2: #00cec9;
  --text: #e0e0e0;
  --text-dim: #6c6c80;
  --danger: #ff6b6b;
  --warning: #feca57;
  --success: #51cf66;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}
.header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 1.5rem;
  margin-bottom: 2rem;
}
.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header .date {
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-top: 0.5rem;
}
.section {
  margin-bottom: 2.5rem;
}
.section-title {
  font-size: 1.3rem;
  color: var(--accent2);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.2rem;
  margin-bottom: 1rem;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--accent); }
.card h3 {
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
}
.card p {
  color: var(--text-dim);
  font-size: 0.95rem;
  margin-bottom: 0.5rem;
}
.tag {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 4px;
  margin-right: 4px;
}
.tag.update { background: var(--accent2); }
.tag.opportunity { background: var(--warning); color: #000; }
.tag.risk { background: var(--danger); }
.source-link {
  font-size: 0.8rem;
  color: var(--accent2);
  text-decoration: none;
}
.source-link:hover { text-decoration: underline; }
.footer {
  border-top: 1px solid var(--border);
  padding-top: 1.5rem;
  color: var(--text-dim);
  font-size: 0.8rem;
  text-align: center;
}
.lead {
  font-size: 1.05rem;
  color: var(--text-dim);
  font-style: italic;
  margin-bottom: 1.5rem;
  padding: 1rem;
  background: var(--card);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>🤖 AI Intel Daily</h1>
  <div class="date">August 05, 2026 — NK's Operations</div>
</div>

<h1>AI Intel Daily — August 05, 2026</h1>

<div class="footer">
  <p>Research compiled by ALEX for Nirman Khaīrnar — NK's Ops</p>
  <p>Sources linked inline. All content from last 24-48 hours.</p>
</div>
</body>
</html>
